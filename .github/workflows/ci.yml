# CI cho PB-06 — kênh bằng chứng theo Delegation #8 / RISK A7:
# kết quả tính theo artifact của runner này, không theo lời tường thuật của bất kỳ ai (kể cả AI).

name: CI-PB06

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff pytest

      - name: Lint (src + tests)
        run: ruff check src/ tests/

      - name: Smoke tests (cấu trúc repo + luật cứng .env)
        run: pytest tests/test_smoke.py -q

  # Cổng DoD-4 · RISK B1: request ngoài whitelist PHẢI bị chặn → test pass.
  # Job riêng để hiện thành check độc lập — thêm vào Required checks của branch protection.
  egress-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install pytest

      - name: Egress guard — mặc định đóng + chặn ngoài whitelist (DoD-4)
        run: pytest tests/test_egress.py -v

  # ── Chỗ để sẵn cho các cổng Wave 1 còn lại ──────────────────────────────────
  # TODO (W1-05 · Sprint 0): job db-audit
  #   UPDATE/DELETE trên audit_logs phải bị DB trigger TỪ CHỐI → test pass (DoD-5).
  # TODO (W1-13/W1-20 · Sprint 1-2): job validator-test
  #   D6-a: trường không span khớp verbatim → ROLLBACK toàn transaction.
  #   D6-b: câu dữ kiện không neo → bị cắt; không đủ nghĩa → insufficient_grounding.

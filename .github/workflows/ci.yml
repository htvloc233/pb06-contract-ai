# Đặt file này tại: .github/workflows/ci.yml
# CI cho PB-06 — kênh bằng chứng theo Delegation #8 / RISK A7:
# kết quả tính theo artifact của runner này, không theo lời tường thuật của bất kỳ ai (kể cả AI).

name: CI-PB06

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff pytest

      - name: Lint (src + tests)
        run: ruff check src/ tests/

      - name: Smoke tests (cấu trúc repo + luật cứng .env)
        run: pytest tests/ -q

